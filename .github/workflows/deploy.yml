# Deploys main to Cloud Run after the `ci` workflow passes.
# Inactive until scripts/gcp-bootstrap.sh has set the GCP_* repository variables.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.GCP_WIF_PROVIDER != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (source build, Vertex AI via ADC — no API key)
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: |
          args=(
            --source . --project "$PROJECT_ID" --region us-central1
            --allow-unauthenticated --quiet
            --memory 1Gi --cpu 1 --concurrency 40 --timeout 90 --min-instances 0 --max-instances 5
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,FIRESTORE_DATABASE=festiplan,GEMINI_MODEL=${GEMINI_MODEL}"
          )
          # Dedicated least-privilege runtime identity when bootstrapped with it; projects set up
          # before GCP_RUNTIME_SA existed keep the service's current identity.
          if [[ -n "${RUNTIME_SA}" ]]; then
            args+=(--service-account "${RUNTIME_SA}")
          else
            echo "::notice::GCP_RUNTIME_SA is not set; deploying with the service's current runtime identity."
          fi
          gcloud run deploy festiplan "${args[@]}"

      - name: Smoke test the live service
        run: |
          URL=$(gcloud run services describe festiplan --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --format='value(status.url)')
          HEALTH=$(curl -fsS --retry 5 --retry-delay 3 "$URL/api/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "$URL/"
          { echo "### Live: $URL"; echo '```json'; echo "$HEALTH"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
