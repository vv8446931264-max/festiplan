# Deploys main to Cloud Run after the `ci` workflow passes on a push to main.
# Inactive until scripts/gcp-bootstrap.sh has set the GCP_* repository variables.
# `workflow_run` also fires for pull-request CI runs (including forks, whose branch may be
# named "main"), so the job only runs for successful CI runs triggered by a push in this
# repository, or for a manual dispatch on main.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.GCP_WIF_PROVIDER != '' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Deploy to Cloud Run (source build, Vertex AI via ADC — no API key)
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: |
          args=(
            --source . --project "$PROJECT_ID" --region us-central1
            --allow-unauthenticated --quiet
            --memory 1Gi --cpu 1 --concurrency 40 --timeout 90 --min-instances 0 --max-instances 5
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,FIRESTORE_DATABASE=festiplan,GEMINI_MODEL=${GEMINI_MODEL}"
          )
          # Dedicated least-privilege runtime identity when bootstrapped with it; projects set up
          # before GCP_RUNTIME_SA existed keep the service's current identity.
          if [[ -n "${RUNTIME_SA}" ]]; then
            args+=(--service-account "${RUNTIME_SA}")
          else
            echo "::notice::GCP_RUNTIME_SA is not set; deploying with the service's current runtime identity."
          fi
          gcloud run deploy festiplan "${args[@]}"

      - name: Smoke test the live service
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          URL=$(gcloud run services describe festiplan --project "$PROJECT_ID" --region us-central1 --format='value(status.url)')
          HEALTH=$(curl -fsS --retry 5 --retry-delay 3 "$URL/api/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "$URL/"
          { echo "### Live: $URL"; echo '```json'; echo "$HEALTH"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
